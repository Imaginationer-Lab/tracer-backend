name: outage-map

# docker compose up -d --build                        api + db
# docker compose --profile test run --rm --build test  엔진·서버 단위 테스트
# docker compose --profile test run --rm newman        Postman 컬렉션 (api가 떠 있어야 함)
#
# 다른 Postgres(Supabase 등)를 쓰려면 .env에 DATABASE_URL을 넣는다 (docs/deploy.md)

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgres://outage:${POSTGRES_PASSWORD:-outage-local-only}@db:5432/outage_map}
    depends_on:
      db:
        condition: service_healthy
    # 무상태 서버라 죽어도 다시 띄우면 복구된다
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 이 서비스 전용 Postgres. 포트를 밖에 열지 않는다 (compose 네트워크 안에서만 api가 붙음)
  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: outage_map
      POSTGRES_USER: outage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outage-local-only}
    volumes:
      # Postgres 18부터 데이터 경로가 /var/lib/postgresql/<버전>/docker 로 바뀌어서 상위 폴더를 붙인다
      - pg-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outage -d outage_map"]
      interval: 5s
      timeout: 3s
      retries: 30

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

  newman:
    image: postman/newman:6-alpine
    profiles: ["test"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./postman:/etc/newman:ro
    command: ["run", "outage-map.postman_collection.json", "-e", "local.postman_environment.json", "--env-var", "baseUrl=http://api:3000"]

volumes:
  pg-data:
